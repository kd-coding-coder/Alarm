<!DOCTYPE html>
<html>
    <head>
        <title>Counting Timer with Alarm</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body{
                background-color: rgb(233, 201, 255);
                padding: 20px;
            }

            .container{
                max-width: 500px;
                margin-top: 50px;
                padding: 20px;
                background-color: rgb(195, 158, 229);
            }

            .form-group{
                margin-bottom: 15px;
            }

            #countResult{
                margin-top: 20px;
                font-size: 1.5rem;
                font-weight: bold;
                text-align: center;
            }

            #countBtn{
                margin-top: 20px;
                background-color: blueviolet;
            }

            #alarm {
                display:none
            }

            #stopBtn{
                display: none;
                margin-top: 20px;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <h2 class="text-center">Counting Timer with Alarm</h2>
            <form id="countForm">
                <div class="form-group">
                    <label for="countNumber">Enter a number to count up to:</label>
                    <input type="number" id="countNumber" class="form-control" placeholder="Enter a number" required>
                </div>

                <button type="button" id="countBtn" class="btn btn-primary w-100" onclick="startCounting()">Start Counting</button>
            </form>

            <div id="countResult"></div>

            <audio id="alarm" src="alarm music.mp3" preload="auto" ></audio>

            <button type="button" id="stopBtn" class="btn btn-danger w-100" onclick="stopSound()">Stop Sound</button>
        </div>

        <script>
          function playAlarm() {
            const alarmSound = document.getElementById("alarm");
            alarmSound.play();

            document.getElementById("stopBtn").style.display = "block";
          }  

          function stopSound() {
            const alarmSound = document.getElementById("alarm");
            alarmSound.pause();
            alarmSound.currentTime = 0

            document.getElementById("stopBtn").style.display = "none";
          }

          function startCounting() {
            const countNumber = document.getElementById("countNumber").value;
            const countResult = document.getElementById("countResult");

            countResult.innerHTML = "";

            if (countNumber){
                let result = "";
                let count = 1;

                const interval = setInterval(function() {
                    result += `${count} <br>`;
                    countResult.innerHTML = result;
                    count++;

                    if(count > countNumber) {
                        clearInterval(interval);
                        countResult.innerHTML += "Counting Complete!🎉";
                        playAlarm();
                    }
                },1000);
            }else{
                countResult.innerHTML = "<p>Please Enter a Valid Number.</p>";
            }
          }
        </script>

    </body>
</html>
